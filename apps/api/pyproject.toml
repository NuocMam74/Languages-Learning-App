[project]
name = "parlo-api"
version = "0.1.0"
description = "API Parlo (FastAPI) — Phase 0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "anthropic>=1.5.0",
    "weasyprint>=70.0",
    "fpdf2>=2.8.8",
    "apscheduler>=3.11.3",
    "pywebpush>=2.5.0",
    "tzdata>=2026.4",
    "boto3>=1.43.93",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "pypdf>=6.18.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC", "S", "T20"]
ignore = [
    "RUF001", "RUF002", "RUF003", # guillemets et apostrophes typographiques dans les commentaires français
    "B008",                       # Depends() dans les signatures FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"app/seed.py" = ["S105", "T20"]
"app/maintenance.py" = ["T20"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]
